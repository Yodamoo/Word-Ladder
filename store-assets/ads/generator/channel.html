<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--ink:#0F1613;--sage:#8A9789;--stone:#E8EBE3;--torch:#E0BE55}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--ink);overflow:hidden}
.stage{position:relative;width:var(--w);height:var(--h);background:var(--ink);overflow:hidden}
.mark{color:var(--stone)}
/* profile picture: mark centred, sized to sit comfortably inside YouTube's circle crop */
.pfp .mark{position:absolute;left:50%;top:50%;width:62%;height:62%;transform:translate(-50%,-50%)}
/* banner: everything inside the 1546x423 centre safe area */
.banner{background:
  radial-gradient(ellipse 40% 60% at 50% 50%, rgba(138,151,137,.10), transparent 70%), var(--ink)}
.safe{position:absolute;left:50%;top:50%;width:1546px;height:423px;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;gap:56px}
.banner .mark{width:250px;height:250px;flex:none}
.words{display:flex;flex-direction:column;gap:18px}
h1{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-.03em;
  font-size:116px;line-height:.9;color:var(--stone);display:flex;align-items:baseline;gap:28px;white-space:nowrap}
h1 .sub{font-family:Arial,sans-serif;font-weight:700;font-size:40px;letter-spacing:.34em;color:var(--sage);line-height:1}
.line{font-family:Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif;font-size:40px;color:var(--sage);white-space:nowrap}
.line b{color:var(--torch);font-weight:400}
</style></head>
<body>
<div class="stage" id="s"></div>
<script>
const Q=new URLSearchParams(location.search), kind=Q.get('kind'), W=+Q.get('w'), H=+Q.get('h');
const s=document.getElementById('s'); s.style.setProperty('--w',W+'px'); s.style.setProperty('--h',H+'px'); s.classList.add(kind);
const MARK=`<svg class="mark" viewBox="0 0 120 120"><path d="M49.5 43.6 A20 20 0 1 0 49.5 76.4" fill="none" stroke="currentColor" stroke-width="14"/><g transform="translate(69.01, 37.86) rotate(30)" fill="currentColor"><rect x="0" y="0" width="44" height="14"/><rect x="15" y="14" width="14" height="26"/></g></svg>`;
if (kind==='pfp') s.innerHTML=MARK;
else s.innerHTML=`<div class="safe">${MARK}<div class="words"><h1>Cow Tippers<span class="sub">Games</span></h1><div class="line">Puzzles you can finish on a <b>coffee break</b>.</div></div></div>`;
window.ready=document.fonts.ready.then(()=>true);
</script>
</body></html>
